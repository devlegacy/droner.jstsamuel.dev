<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Droner</title>
    <!-- <base href="https://devlegacy.github.io/droner/" /> -->
    <base href="/" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.12.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/assets/css/app.css" />
  </head>
  <body>
    <header class="container header">
      <a class="no-link" href="#" rel="nofollow noopener noreferrer">
        <img class="header__logo" src="/assets/img/logo.png" alt="Drone logo" />
        <span class="header__slogan">Your source for everything drone</span>
      </a>
      <nav>
        <ul class="nav">
          <li class="nav__item">
            <a
              class="nav__link no-link"
              href="#"
              title="Guides"
              rel="nofollow noopener noreferrer"
            >
              <i class="fas fa-book-open"></i>
              <span class="nav__text">Guides</span>
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link no-link"
              href="#"
              title="Laws"
              rel="nofollow noopener noreferrer"
            >
              <i class="fas fa-gavel"></i>
              <span class="nav__text">Laws</span>
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link no-link"
              href="#"
              title="Shop"
              rel="nofollow noopener noreferrer"
            >
              <i class="fas fa-store"></i>
              <span class="nav__text">Shop</span>
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link no-link"
              href="#"
              title="Forums"
              rel="nofollow noopener noreferrer"
            >
              <i class="fas fa-comments"></i>
              <span class="nav__text">Forums</span>
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link no-link"
              href="#"
              title="Contact"
              rel="nofollow noopener noreferrer"
            >
              <i class="fas fa-info-circle"></i>
              <span class="nav__text">Contact</span>
            </a>
          </li>
        </ul>
      </nav>
    </header>
    <section class="banner">
      <div class="container">
        <p class="banner__feature">Feature</p>
        <h1 class="banner__title">
          The state's war on dones
          <a href="#">
            <img src="/assets/img/external.png" alt="External drone" />
          </a>
        </h1>
        <p class="banner__summary">
          We take a look at how the new drone regulations make it hard to enjoy
          being a droner and how it impacts your ability to fly.
        </p>
      </div>
    </section>
  </body>
</html>
